breaking: none — without models and cost in the settings, kits, specs, commands and scripts behave as before.
review:
  - question: Why are VS Code Copilot numbers estimates?
    answer: |
      Its chat transcript has every turn but no token counts. The script counts characters ÷ 4,
      treats the previous request's context as cached and resets at the context cap (D11);
      COSTS.md lists the limits. Claude Code logs real usage, so those numbers are measured.
  - question: Is the cost what we pay?
    answer: |
      No — it is the value of the GitHub AI credits used at Copilot's per-token rates. Within the
      plan's monthly credits nothing extra is paid. COSTS.md and every number say "estimate".
  - question: Does an existing project start tracking cost after --update?
    answer: |
      No. GENERATE KIT --update never adds the cost block; only the first GENERATE KIT writes it.
      Q7 is asked once on --update because it is a new question.
  - question: Why does the bash script need python3?
    answer: |
      Reading JSON lines and doing the arithmetic in plain bash would need jq and bc and still
      differ from PowerShell; python3 gives the same numbers as the PowerShell script.
