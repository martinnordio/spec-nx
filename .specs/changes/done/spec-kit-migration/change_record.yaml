# yaml-language-server: $schema=../../../../stages/review/change_record.schema.json
version: 1
branch: feature/spec-kit-migration
base: 3cae701
why: |
  spec-nx had three stages (requirements, plan, pr) and four setup questions, so a team could
  not yet replace the original hand-written spec-kit with a generated kit. This branch brings
  over everything the migration plan kept: implementation, documentation and review stages,
  on-demand improvement, setup and ui stages, coding guidelines, a spec for new projects, a
  private company layer and agent permissions — as building blocks, with no company content.
