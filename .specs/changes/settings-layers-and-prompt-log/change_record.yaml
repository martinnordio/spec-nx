breaking: "no — files with one or two layers give the same settings as before; new parameters are optional and come after the existing positional ones; usage without -Run behaves as before when the project has one chat in the range, and only refuses to guess when it has several"
review:
  - question: Why does usage now stop when two chats are found, instead of taking the busiest?
    answer: |
      The busiest chat is often the other one (a long implementation chat next to a short
      review chat), so the cost of one command was silently booked to another. An error that
      names both logs, plus the marker that every stage now writes, is always right.
  - question: Why is the kit's own settings file a layer, and why are some keys project-only?
    answer: |
      A shared kit used as a submodule had its defaults baked into the prompts at generation;
      reading its file at run time lets a team change a default without regenerating every
      project. Keys like kit_dir or shells describe the generated kit itself, so a kit's or a
      developer's value for them would be wrong for the project.
  - question: How does "assigned_to null" differ from no assigned_to, if null removes the key?
    answer: |
      The merge removes the value but keeps where it was removed ("(removed)" in -Source), so the
      scripts see "set to nobody in this file" and do not fall back to assigning it to you.
  - question: Why are the usage checks committed when testing/ is local?
    answer: |
      They use only synthetic logs and specs, and they are the tests of S21 and S22; the rest of
      testing/ stays a local scratch area (.gitignore keeps only README.md and usage/).
