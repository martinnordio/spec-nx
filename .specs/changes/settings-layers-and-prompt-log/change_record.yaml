# yaml-language-server: $schema=../../../stages/review/change_record.schema.json
version: 1
branch: feature/settings-layers-and-prompt-log
base: 9e2445b
why: |
  A developer could not adapt the settings to their own work (another parent, only the
  requirements, their backlog area) without changing the committed file for everyone; backlog
  items and issues were created without area, iteration, assignee or type; there was no record
  of the prompts behind a spec; and two chats on one project could get each other's cost. This
  branch reads the settings in three layers (kit, project, developer), adds work-item fields,
  an optional prompt log and a per-chat cost marker, finishes the Copilot CLI costs spec, and
  documents it all on one page.
