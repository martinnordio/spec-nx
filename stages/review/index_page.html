<!DOCTYPE html>
<!-- Index of the review pages: .specs/review/index.html. REVIEW: creates it from this template if
     missing and adds one row per page, newest first; a re-run of the same branch updates its row. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code reviews · {{project}}</title>
<style>
  body { margin: 0; padding: 1.5rem; font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; color: #1a1d21; background: #f7f8fa; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { border-left: 5px solid #2563eb; padding-left: 0.75rem; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: 0.9rem; }
  th, td { border: 1px solid #d5d9e0; padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: #f7f8fa; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; font-variant-ligatures: none; }
  a { color: #1d4ed8; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e8eb; background: #111418; } table { background: #1a1e24; }
    th { background: #111418; } th, td { border-color: #343a44; } a { color: #6ea2ff; }
  }
</style>
</head>
<body>
<main>
  <h1>Code reviews</h1>
  <p>Written by the review stage (<code>REVIEW:</code>). Newest first.</p>
  <table>
    <thead>
      <tr><th>Date</th><th>Scope</th><th>Mode</th><th>Range</th><th>Snippets</th><th>Open findings</th></tr>
    </thead>
    <tbody>
      <!-- REPEAT per page, newest first:
      <tr>
        <td><a href="{{yyyy-mm-dd}}_{{branch-slug}}.html">{{yyyy-mm-dd}}</a></td>
        <td><code>{{scope folder, or the repository}}</code></td>
        <td>branch <code>{{branch}}</code> + semantic diff</td>
        <td><code>{{base}}..{{head}}</code></td>
        <td>{{n highlights}} + {{n record blocks}} record blocks</td>
        <td>{{n}} ({{n should-fix, n nit}})</td>
      </tr>
      -->
    </tbody>
  </table>
</main>
</body>
</html>
